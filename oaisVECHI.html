<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaD-oais v3.2.2</title>
  <style>
    :root {
      --bg-dark: #1f1f2e;
      --bg-header: #171722;
      --bg-panel: #272738;
      --bg-sidebar: #222232;
      --accent-orange: #c86d12;
      --accent-blue: #3b82f6;
      --btn-bg: #2d4360;
      --btn-green: #2e7d32;
      --btn-hover: #3b587e;
      --text-main: #d0d0e0;
      --border-color: #1a1a24;
      --console-bg: #111118;
      --console-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    /* Header Bar */
    header {
      background-color: var(--bg-header);
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-weight: bold;
      font-size: 13px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-bar input {
      background: #14141d;
      border: 1px solid #333348;
      color: #fff;
      padding: 4px 10px;
      border-radius: 3px;
      width: 320px;
      font-size: 12px;
    }

    .search-bar input[type="date"] {
      width: 130px;
    }

    /* App Container */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 36px);
    }

    /* Left Sidebar */
    .sidebar-left {
      width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 11px;
      font-weight: bold;
      color: #9090a8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tree-view {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0;
    }

    .tree-folder {
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e0e0f0;
    }
    .tree-folder.selected { background-color: #34344d; color: #fff; }

    .tree-file {
      padding: 5px 12px 5px 28px;
      cursor: pointer;
      color: #b0b0cc;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .tree-file:hover { background-color: #2a2a3e; color: #fff; }
    .tree-file.selected { background-color: #34344d; color: #fff; }

    /* Main Content Area */
    .main-content {
      flex: 1;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding: 10px;
      gap: 10px;
    }

    /* Progress Panel */
    .progress-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px 12px;
      display: none;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #14141d;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-blue);
      transition: width 0.2s ease;
    }

    /* Center Display Area */
    .center-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .folder-title-view {
      display: none;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 40px;
    }

    .image-preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      max-height: 85%;
    }

    .image-preview-container img {
      max-width: 100%;
      max-height: 65vh;
      border: 1px solid #333;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .image-subtext {
      margin-top: 8px;
      color: #707088;
      font-size: 12px;
    }

    /* Console Overlay */
    .console-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      height: 350px;
      background-color: var(--console-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: var(--console-green);
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }

    .console-line { line-height: 1.3; }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 12px;
      background-color: var(--console-green);
      margin-left: 4px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Right Sidebar */
    .sidebar-right {
      width: 340px;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .right-header {
      padding: 10px 12px;
      font-weight: bold;
      font-size: 13px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-sidebar);
    }

    .accordion-item {
      border-bottom: 1px solid var(--border-color);
    }

    .accordion-title {
      padding: 8px 12px;
      font-weight: bold;
      font-size: 11px;
      color: #b0b0cc;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-sidebar);
    }

    .accordion-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 0 4px 0;
    }

    /* Top Action Dual Buttons */
    .action-row-top {
      display: flex;
      width: 100%;
    }

    .btn-receptie {
      flex: 1;
      background-color: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-explorare {
      flex: 1;
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .subgroup-header {
      background-color: var(--btn-bg);
      color: #ffffff;
      padding: 6px 10px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      border: none;
      margin-top: 2px;
    }

    .subgroup-header.green { background-color: var(--btn-green); }

    .subgroup-body {
      display: none;
      flex-direction: column;
      gap: 2px;
      background-color: #1a1a26;
      padding: 2px 0;
    }

    .subgroup-body.open { display: flex; }

    .btn-sub-action {
      background-color: #385375;
      color: #fff;
      border: none;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }

    .btn-sub-action:hover { background-color: var(--btn-hover); }

    /* Details Panel Styling */
    .details-box {
      padding: 10px 12px;
      font-size: 11px;
      color: #c0c0d0;
      line-height: 1.5;
    }

    .details-field {
      margin-bottom: 6px;
      word-break: break-all;
    }

    .details-label {
      font-weight: bold;
      color: #ffffff;
    }

    .uuid-highlight {
      background-color: #1d3326;
      color: #00ffaa;
      padding: 1px 4px;
      border-radius: 2px;
    }

    .event-card {
      border-bottom: 1px solid #2d2d3f;
      padding: 8px 0;
    }

    .event-card:last-child { border-bottom: none; }
    .event-title { font-weight: bold; color: #89b4fa; }
    .event-time { color: #888; font-size: 10px; }

/* Stiluri necesare pentru expandarea filtrelor din rezultate */
  .corupte-content.open, .lipsa-content.open {
    max-height: 200px !important;
  }
  .arrow.rotated {
    transform: rotate(180deg);
  }
  
 /* Stil pentru butoane dezactivate din panoul drept */
.btn-sub-action:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background-color: #2a3a50 !important;
}
/* Containerul header-ului din sidebar */
.sidebar-header {
  display: flex;
  flex-direction: column; /* Așază logo-ul deasupra textului */
  align-items: center;    /* Centrează orizontal logo-ul și textul */
  gap: 8px;               /* Spațiu între logo și text */
  padding: 10px 0;
}

/* Stilul și dimensiunea logo-ului GIF */
.sidebar-logo {
  width: 60px;       /* Ajustează lățimea după preferință */
  height: auto;      /* Păstrează proporțiile imaginii */
  max-width: 100%;   /* Împiedică depășirea laturii containerului */
  object-fit: contain;
}
  </style>
</head>
<body>

<div class="subgroup-body" id="group-post-ingestie">

  <script>
  // Starea globală a aplicației
let isFolderLoaded = false;

function updatePostIngestButtonsState() {
  const container = document.getElementById('group-post-ingestie');
  if (!container) return;

  const buttons = container.querySelectorAll('.btn-sub-action');
  buttons.forEach(btn => {
    btn.disabled = !isFolderLoaded;
    if (!isFolderLoaded) {
      btn.title = "Trebuie mai întâi să încărcați sau să explorați un pachet/folder!";
    } else {
      btn.removeAttribute('title');
    }
  });
}
    function toggleSection(contentId, arrowId) {
      const content = document.getElementById(contentId);
      const arrow = document.getElementById(arrowId);
      if (content.style.display === 'none') {
        content.style.display = 'flex';
        arrow.textContent = '▼';
      } else {
        content.style.display = 'none';
        arrow.textContent = '▲';
      }
    }

    function toggleSubgroup(groupId) {
      document.getElementById(groupId).classList.toggle('open');
    }

    function openReport() {
      window.open('TM-FD-12345-2026.08.24_VALIDAT/Certificat_Audit_TM-FD-12345-2026.08.24.html', '_blank');
    }

    function closeConsole() {
      document.getElementById('console-overlay').style.display = 'none';
    }

    // Button Explorare Folder Mode
    document.getElementById('btn-explorare').addEventListener('click', () => {
      const treeView = document.getElementById('tree-view');
      treeView.innerHTML = `
        <div class="tree-folder" onclick="showFolderDetails()">📁 Test_imagini (2)</div>
        <div class="tree-file" onclick="selectImage('Test_imagini/TM-FD-01194-1901.jpg', 'TM-FD-01194-1901.jpg', this)">📄 TM-FD-01194-1901.jpg</div>
        <div class="tree-file" onclick="selectImage('Test_imagini/TM-FD-01194-1902.jpg', 'TM-FD-01194-1902.jpg', this)">📄 TM-FD-01194-1902.jpg</div>
        <div class="tree-file" onclick="selectImage('Test_imagini/TM-FD-01194-1903.jpg', 'TM-FD-01194-1903.jpg', this)">📄 TM-FD-01194-1903.jpg</div>
        <div class="tree-file" onclick="selectImage('Test_imagini/TM-FD-01194-1904.jpg', 'TM-FD-01194-1904.jpg', this)">📄 TM-FD-01194-1904.jpg</div>
		<div class="tree-file" onclick="selectImage('Test_imagini/TM-FD-01194-1905.jpg', 'TM-FD-01194-1905.jpg', this)">📄 TM-FD-01194-1905.jpg</div>
      `;
isFolderLoaded = true;
  updatePostIngestButtonsState();
    });

    // WORKFLOW SIMULARE RECEPȚIE SIP
    document.getElementById('btn-receptie').addEventListener('click', () => {
      const consoleOverlay = document.getElementById('console-overlay');
      const consoleLogs = document.getElementById('console-logs');
      const progressPanel = document.getElementById('progress-panel');
      const progressBar = document.getElementById('progress-bar');
      const progressPercent = document.getElementById('progress-percent');
      const progressStatus = document.getElementById('progress-status');

      progressStatus.textContent = "Procesare SIP...";
      consoleLogs.innerHTML = '';
      consoleOverlay.style.display = 'flex';
      progressPanel.style.display = 'block';

      const steps = [
        { text: '[8:42:41 AM] Inițiere proces ingestie SIP...', pct: 5 },
        { text: '[8:42:41 AM] Vă rugăm selectați Arhiva ZIP a pachetului...', pct: 15 },
        { text: '[8:42:50 AM] ZIP selectat: TM-FD-12345-2026.08.24.zip', pct: 30 },
        { text: '[8:42:50 AM] Vă rugăm selectați Manifestul Extern (ME-SIP.json)...', pct: 40 },
        { text: '[8:42:53 AM] Manifest selectat: ME-SIP_TM-FD-12345-2026.08.24.json', pct: 50 },
        { text: '[8:42:53 AM] Se verifică integritatea și se procesează datele...', pct: 65 },
        { text: '[8:42:57 AM] Manifest extern [ME-SIP_TM-FD-12345-2026.08.24.json] valid conform cu [MI-SIP_TM-FD-12345-2026.08.24.json] »', pct: 75 },
        { text: '[8:42:57 AM] Validare încrucișată finalizată cu succes »', pct: 80 },
        { text: '[8:42:57 AM] Pachet SIP complet »', pct: 85 },
        { text: '[8:42:58 AM] Structura conformă cu ME-SIP »', pct: 90 },
        { text: '[8:42:58 AM] Integritate SIP validată »', pct: 95 },
        { text: '[8:42:58 AM] Succes: Ingestie completă: 2 fișiere validate. Raport generat în folder.', pct: 98 },
        { text: '[8:42:58 AM] Pachet [TM-FD-12345-2026.08.24] înregistrat în DB folosind [MI-SIP_TM-FD-12345-2026.08.24.json].', pct: 99 },
        { text: '[8:42:58 AM] Se afișează structura ierarhică a pachetului. TM-FD-12345-2026.08.24_VALIDAT', pct: 100 },
        { text: '[8:42:58 AM] Timp total procesare: 1.2 secunde', pct: 100 },
        { text: '[8:42:58 AM] Viteză medie: 1.67 fișiere/secundă', pct: 100 },
        { text: '[8:42:58 AM] Click pe consolă pentru a o închide █', pct: 100 }
      ];

      let stepIdx = 0;
      const interval = setInterval(() => {
        if (stepIdx < steps.length) {
          const line = document.createElement('div');
          line.className = 'console-line';
          line.textContent = steps[stepIdx].text;
          consoleLogs.appendChild(line);
          consoleOverlay.scrollTop = consoleOverlay.scrollHeight;

          progressBar.style.width = steps[stepIdx].pct + '%';
          progressPercent.textContent = steps[stepIdx].pct + '%';

          stepIdx++;
        } else {
          clearInterval(interval);
          loadIngestedPackage();
          openReport();
        }
      }, 250);
    });

    // WORKFLOW SIMULARE SCANARE ANTIVIRUS
    document.getElementById('btn-antivirus').addEventListener('click', () => {
      const consoleOverlay = document.getElementById('console-overlay');
      const consoleLogs = document.getElementById('console-logs');
      const progressPanel = document.getElementById('progress-panel');
      const progressBar = document.getElementById('progress-bar');
      const progressPercent = document.getElementById('progress-percent');
      const progressStatus = document.getElementById('progress-status');

      progressStatus.textContent = "Scanare Antivirus în desfășurare...";
      consoleLogs.innerHTML = '';
      consoleOverlay.style.display = 'flex';
      progressPanel.style.display = 'block';

      const steps = [
        { text: '[10:48:41 AM] Pornire scanare antivirus pe: TM-FD-12345-2026.08.19_VALIDAT', pct: 20 },
        { text: '[10:48:41 AM] Cale: C:\\Users\\Puribus\\Storage\\SIP_TM-FD-12345-2026.08.19\\TM-FD-12345-2026.08.19_VALIDAT', pct: 40 },
        { text: '[10:48:41 AM] Motor: Windows Defender (MpCmdRun)', pct: 65 },
        { text: '[10:48:41 AM] Data scanării: 24.08.2026, 10:48:41', pct: 85 },
        { text: '[10:48:41 AM] Scanare finalizată cu succes', pct: 95 },
        { text: '[10:48:41 AM] Rezultat: Curat (fără amenințări)', pct: 100 },
        { text: '[10:48:41 AM] Click pe consolă pentru a o închide █', pct: 100 }
      ];

      let stepIdx = 0;
      const interval = setInterval(() => {
        if (stepIdx < steps.length) {
          const line = document.createElement('div');
          line.className = 'console-line';
          line.textContent = steps[stepIdx].text;
          consoleLogs.appendChild(line);
          consoleOverlay.scrollTop = consoleOverlay.scrollHeight;

          progressBar.style.width = steps[stepIdx].pct + '%';
          progressPercent.textContent = steps[stepIdx].pct + '%';

          stepIdx++;
        } else {
          clearInterval(interval);
          addAntivirusEventToHistory();
        }
      }, 300);
    });

    function addAntivirusEventToHistory() {
      const historyContent = document.getElementById('history-content');
      const newCard = document.createElement('div');
      newCard.className = 'event-card';
      newCard.innerHTML = `
        <div class="event-time">24 august 2026 la 07:48:41</div>
        <div class="event-title">Tip eveniment: antivirus scan</div>
        <div>Detalii: Scanare antivirus curată – 4 fișiere</div>
        <div>Agent: Windows Defender MpCmdRun</div>
      `;
      historyContent.insertBefore(newCard, historyContent.firstChild);
    }

    function loadIngestedPackage() {
      const treeView = document.getElementById('tree-view');

              <button class="btn-small-act btn-act-fix" data-action="fix-ext" data-new-name="TM-FD-00135-01.tif" style="background:#059669; color:#fff; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:11px;">Corectează .tif</button>
            </td>
          </tr>
          
          <tr class="duplicate-group-header" style="background: rgba(255, 200, 150, 0.1);">
            <td colspan="4" style="padding:6px; font-weight:bold; color:#4CAF50; font-size:11px;">
              Duplicate (2 apariții) – SHA-256: <code>e3b0c44298fc1c149afbf4c8996fb924...</code>
            </td>
          </tr>
          <tr class="duplicate-row" style="background: rgba(255, 200, 150, 0.05); transition: opacity 0.3s ease;">
            <td style="padding:6px;">IMG_002_copy.jpg</td>
            <td style="padding:6px; color:#f87171;">🚨 Hash identic / Hash SHA-256 collisions </td>
            <td style="padding:6px; color:#aaa;">SHA256 match</td>
            <td style="padding:6px;">
              <button class="btn-small-act btn-act-del" data-action="delete" style="background:#dc2626; color:#fff; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:11px;">Șterge duplicat</button>
            </td>
          </tr>
        </tbody>
      </table>
    `;

    // Event Delegation actualizat pentru modificarea numelui și stării în timp real
    resultsPlaceholder.onclick = (e) => {
      const target = e.target;
      const row = target.closest('tr');

      if (target.dataset.action === 'fix-ext') {
        const newName = target.dataset.newName || 'TM-FD-00135-01.tif';
        
        // 1. Schimbă numele fișierului în coloană
        const fileNameCell = row.querySelector('.file-name-cell');
        if (fileNameCell) {
          fileNameCell.textContent = newName;
          fileNameCell.title = newName;
          fileNameCell.style.color = '#34d399';
        }

        // 2. Schimbă statusul problemei
        const issueCell = row.querySelector('.issue-cell');
        if (issueCell) {
          issueCell.innerHTML = '<span style="color:#10b981; font-weight:500;">✅ Extensie sincronizată (.tif)</span>';
        }

        // 3. Schimbă stilul rândului și al butonului
        row.style.background = 'rgba(16, 185, 129, 0.12)';
        target.textContent = 'Corectat ✓';
        target.style.background = '#334155';
        target.disabled = true;
        target.style.cursor = 'default';

        if (typeof addEventToHistory === 'function') {
          addEventToHistory('extension fix', `Corectat extensie fișier în ${newName}`);
        }

      } else if (target.dataset.action === 'delete') {
        if (row) {
          row.style.opacity = '0';
          setTimeout(() => {
            const tbody = row.closest('tbody');
            row.remove();

            // Dacă nu mai sunt alte duplicate, elimină și rândul header de grup
            if (tbody && !tbody.querySelector('.duplicate-row')) {
              const headerGroup = tbody.querySelector('.duplicate-group-header');
              if (headerGroup) headerGroup.remove();
            }
          }, 300);
        }

        if (typeof addEventToHistory === 'function') {
          addEventToHistory('duplicate remove', 'Șters fișier duplicat identificat prin SHA-256.');
        }
      }
    };

    if (typeof addEventToHistory === 'function') {
      addEventToHistory('integrity check', 'Găsit 1 extensie greșită și 1 grup de duplicate SHA256.');
    }
  }, 1300);
}

      </div>

      <div class="tools-inventory-bar">

        <span class="tool-tag">Siegfried</span>
        <span class="tool-tag">QPDF</span>
        <span class="tool-tag">VeraPDF</span>
        <span class="tool-tag">ImageMagick</span>

  modalContainer.innerHTML = content;

  document.getElementById('tech-close').addEventListener('click', () => modalContainer.style.display = 'none');
  document.getElementById('tech-start').addEventListener('click', () => runTechnicalAnalysis(modalContainer));
}

function runTechnicalAnalysis(modalContainer) {
  const box = modalContainer.querySelector('#tech-discovery-box');
  if (box) box.innerHTML = '<div style="color: #4fc3f7;">⏳ Rulare inspecții QPDF, ImageMagick și FFprobe...</div>';

  setTimeout(() => {
    const resultsPlaceholder = modalContainer.querySelector('#tech-results-placeholder');
    if (box) box.innerHTML = '<div style="color: #ff4d4d; font-weight:bold;">🚨 Scanare finalizată: 1 fișier corupt detectat!</div>';

    resultsPlaceholder.innerHTML = `
      <table class="modal-table">
        <thead>
          <tr>
            <th>Nume fișier</th>
            <th>Status / Motiv</th>
            <th>Sursă Control</th>
            <th>Acțiune</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>scan_master_001.tif</td>
            <td style="color:#4caf50; font-weight:bold;">✅ OK [m:ImageMagick Valid]</td>
            <td>ImageMagick</td>
            <td><span style="color:#888; font-size:11px;">Nicio acțiune</span></td>
          </tr>
          <tr>
            <td>raport_2026.pdf</td>
            <td style="color:#ff4d4d; font-weight:bold;">❌ Error: Stream xref damaged</td>
            <td>QPDF CLI</td>
            <td><button class="btn-small-act btn-act-del" data-action="delete-corrupt">Șterge & Generează Martor</button></td>
          </tr>
          <tr>
            <td>audio_interviu.wav</td>
            <td style="color:#4caf50; font-weight:bold;">🎬 VALID [PCM 16-bit 44.1kHz]</td>
            <td>FFprobe</td>
            <td><span style="color:#888; font-size:11px;">Nicio acțiune</span></td>
          </tr>
        </tbody>
      </table>
    `;

    // Delegation pentru acțiuni pe tabel
    resultsPlaceholder.onclick = (e) => {
      const target = e.target;
      if (target.dataset.action === 'delete-corrupt') {
        const row = target.closest('tr');
        const fileName = row ? row.cells[0].textContent : 'Fișier PDF';
        if (row) row.remove();
        addEventToHistory('corrupt file remove', `Eliminat ${fileName} și generat martor PREMIS.`);
      }
    };

    addEventToHistory('technical analysis', 'Verificare finalizată: 1 fișier PDF corupt identificat prin QPDF.');
  }, 1500);
}

// ────────────────────────────────────────────────
// HELPER UNIVERSAL ISTORIC
// ────────────────────────────────────────────────
function addEventToHistory(eventType, details) {
  const historyContent = document.getElementById('history-content');
  if (!historyContent) return;

  const now = new Date();
  const dateStr = now.toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('ro-RO');

  const newCard = document.createElement('div');
  newCard.className = 'event-card';
  newCard.innerHTML = `
    <div class="event-time">${dateStr} la ${timeStr}</div>
    <div class="event-title">Tip eveniment: ${eventType}</div>
    <div>Detalii: ${details}</div>
    <div>Agent: MaD-oais Inspection Module v1.0</div>
  `;
  historyContent.insertBefore(newCard, historyContent.firstChild);
}
